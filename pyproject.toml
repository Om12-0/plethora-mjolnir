[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plethora-mjolnir"
version = "1.0.0"
description = "Local semantic file indexer and natural-language search for study/work folders."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
full = ["pypdf>=4.0", "python-docx>=1.1", "watchdog>=4.0"]
semantic = ["fastembed>=0.3", "onnxruntime>=1.17", "sqlite-vec>=0.1"]
gui = ["PySide6>=6.6"]

[project.scripts]
mjolnir = "mjolnir.cli:main"

[tool.setuptools]
packages = ["mjolnir"]
